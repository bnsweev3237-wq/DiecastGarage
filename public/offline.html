<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>You're offline · theCollectorHQ</title>
<style>
  :root { --bg: #fff; --ink: #121212; --muted: #5c5c5c; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f0f10; --ink: #f3f3f3; --muted: #a9a9a9; color-scheme: dark; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px max(16px, env(safe-area-inset-right)) 24px max(16px, env(safe-area-inset-left)); box-sizing: border-box; text-align: center; }
  main { max-width: 360px; display: flex; flex-direction: column; gap: 14px; align-items: center; }
  h1 { margin: 0; font-size: 26px; }
  p { margin: 0; color: var(--muted); }
  button { font: inherit; font-weight: 700; border: 0; border-radius: 999px; padding: 10px 20px; background: #fe7101; color: #121212; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" width="88" height="88" alt="">
  <h1>You're offline</h1>
  <p>theCollectorHQ needs an internet connection. Check your signal or Wi-Fi, then try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
